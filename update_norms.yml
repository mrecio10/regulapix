name: Atualizar Normas do Pix

on:
  schedule:
    - cron: '0 9 * * *'   # Todo dia às 9h UTC = 6h horário de Brasília
  workflow_dispatch:       # Permite disparar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install anthropic requests

      - name: Verificar e injetar novas normas
        run: python update_norms.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commitar no GitHub se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regulapix.html
          git diff --staged --quiet \
            && echo "Sem mudanças para commitar." \
            || (git commit -m "🔄 Normas atualizadas $(date +'%d/%m/%Y')" && git push)

      - name: Diagnosticar Workers na conta Cloudflare
        run: |
          python3 - << 'PYEOF'
          import os, requests

          account_id = os.environ['CLOUDFLARE_ACCOUNT_ID']
          api_token  = os.environ['CLOUDFLARE_API_TOKEN']

          headers = {'Authorization': f'Bearer {api_token}'}

          # Listar todos os workers da conta
          r = requests.get(
              f'https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts',
              headers=headers
          )
          print(f'HTTP: {r.status_code}')
          body = r.json()
          if body.get('success'):
              workers = body.get('result', [])
              print(f'Workers encontrados: {len(workers)}')
              for w in workers:
                  print(f'  - id: {w.get("id")} | etag: {w.get("etag", "")[:8]}')
          else:
              print('Erro:', body.get('errors'))
          PYEOF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publicar HTML atualizado no Cloudflare Worker
        run: |
          python3 - << 'PYEOF'
          import os, sys, json, requests

          account_id  = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          api_token   = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          worker_name = 'regulapix'

          # Verificar se os secrets estão disponíveis
          print('Account ID (primeiros 6):', account_id[:6] if account_id else 'VAZIO!')
          print('API Token (primeiros 6):', api_token[:6] if api_token else 'VAZIO!')

          if not account_id or not api_token:
              print('ERRO: Secrets CLOUDFLARE_ACCOUNT_ID ou CLOUDFLARE_API_TOKEN estao vazios.')
              sys.exit(1)

          with open('regulapix.html', 'r', encoding='utf-8') as f:
              html = f.read()

          html_json = json.dumps(html)

          # Service Worker format — compatível com upload direto como application/javascript
          worker_script = (
              'addEventListener("fetch", event => {\n'
              '  event.respondWith(handleRequest(event.request));\n'
              '});\n\n'
              'async function handleRequest(request) {\n'
              '  const html = ' + html_json + ';\n'
              '  return new Response(html, {\n'
              '    headers: { "Content-Type": "text/html; charset=utf-8" }\n'
              '  });\n'
              '}'
          )

          api_url = (
              'https://api.cloudflare.com/client/v4/accounts/'
              + account_id
              + '/workers/scripts/'
              + worker_name
          )

          print('Enviando', len(worker_script), 'bytes para', api_url[:60] + '...')

          r = requests.put(
              api_url,
              headers={
                  'Authorization': 'Bearer ' + api_token,
                  'Content-Type': 'application/javascript',
              },
              data=worker_script.encode('utf-8')
          )

          print('HTTP status:', r.status_code)
          print('Resposta:', r.text[:600])

          body = r.json()
          if body.get('success'):
              print('Worker atualizado com sucesso!')
          else:
              print('Falha:', body.get('errors'))
              sys.exit(1)
          PYEOF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verificar se o site foi atualizado
        run: |
          python3 - << 'PYEOF'
          import urllib.request, re, time

          time.sleep(5)  # aguarda propagação

          url = 'https://regulapix.msrecio1.workers.dev/regulapix'
          print(f'Verificando {url}...')

          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  html = r.read().decode('utf-8')
              m = re.search(r"LAST_AUTO_UPDATE = '([^']+)'", html)
              if m:
                  print(f'✅ Data no site: {m.group(1)}')
              else:
                  print('⚠️  Data não encontrada no HTML retornado')
          except Exception as e:
              print(f'Erro ao verificar: {e}')
          PYEOF
