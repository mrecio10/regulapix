name: Atualizar Normas do Pix

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install anthropic requests

      - name: Verificar e injetar novas normas
        run: python update_norms.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commitar no GitHub se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regulapix.html
          git diff --staged --quiet \
            && echo "Sem mudanças para commitar." \
            || (git commit -m "Normas atualizadas $(date +'%d/%m/%Y')" && git push)

      - name: Diagnosticar Secrets do Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:0:6}"
          echo "API Token: ${CLOUDFLARE_API_TOKEN:0:6}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "TOKEN VAZIO - verificar Secret no GitHub"
          else
            echo "Token OK - tamanho: ${#CLOUDFLARE_API_TOKEN}"
          fi

      - name: Publicar no Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -c "
          import os, sys, json, requests

          account_id = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          api_token  = os.environ.get('CLOUDFLARE_API_TOKEN', '')

          if not api_token:
              print('Token vazio - abortando')
              sys.exit(1)

          with open('regulapix.html', 'r', encoding='utf-8') as f:
              html = f.read()

          worker_script = (
              'addEventListener(\"fetch\", event => {'
              '  event.respondWith(handleRequest(event.request));'
              '});'
              'async function handleRequest(request) {'
              '  const html = ' + json.dumps(html) + ';'
              '  return new Response(html, {'
              '    headers: {\"Content-Type\": \"text/html; charset=utf-8\"}'
              '  });'
              '}'
          )

          url = 'https://api.cloudflare.com/client/v4/accounts/' + account_id + '/workers/scripts/regulapix'
          r = requests.put(url,
              headers={'Authorization': 'Bearer ' + api_token, 'Content-Type': 'application/javascript'},
              data=worker_script.encode('utf-8'))

          print('HTTP:', r.status_code)
          body = r.json()
          print('Success:', body.get('success'))
          if not body.get('success'):
              print('Errors:', body.get('errors'))
              sys.exit(1)
          print('Worker atualizado!')
          "
