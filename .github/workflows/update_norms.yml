name: Atualizar Normas do Pix

on:
schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install anthropic requests

      - name: Verificar e injetar novas normas
        run: python update_norms.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commitar no GitHub se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regulapix.html
          git diff --staged --quiet \
            && echo "Sem mudanças para commitar." \
            || (git commit -m "Normas atualizadas $(date +'%d/%m/%Y')" && git push)

      - name: Publicar no Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          python3 -c "
          import os, sys, json, requests

          account_id = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          api_key    = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          email      = os.environ.get('CLOUDFLARE_EMAIL', '')

          print('Account ID (6):', account_id[:6])
          print('API Key (6):', api_key[:6] if api_key else 'VAZIO')
          print('Email (6):', email[:6] if email else 'VAZIO')

          if not api_key or not account_id or not email:
              print('ERRO: Secrets ausentes')
              sys.exit(1)

          with open('regulapix.html', 'r', encoding='utf-8') as f:
              html = f.read()

          worker_script = (
              'addEventListener(\"fetch\", event => {'
              '  event.respondWith(handleRequest(event.request));'
              '});'
              'async function handleRequest(request) {'
              '  const html = ' + json.dumps(html) + ';'
              '  return new Response(html, {'
              '    headers: {\"Content-Type\": \"text/html; charset=utf-8\"}'
              '  });'
              '}'
          )

          url = ('https://api.cloudflare.com/client/v4/accounts/'
                 + account_id + '/workers/scripts/regulapix')

          # Autenticação com Global API Key (X-Auth-Email + X-Auth-Key)
          r = requests.put(url,
              headers={
                  'X-Auth-Email': email,
                  'X-Auth-Key': api_key,
                  'Content-Type': 'application/javascript',
              },
              data=worker_script.encode('utf-8'))

          print('HTTP:', r.status_code)
          print('Resposta:', r.text[:400])

          body = r.json()
          if body.get('success'):
              print('Worker atualizado com sucesso!')
          else:
              print('Falha:', body.get('errors'))
              sys.exit(1)
          "
